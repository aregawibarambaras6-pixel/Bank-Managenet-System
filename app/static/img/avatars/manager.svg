<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mgrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="mgrSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="mgrHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <linearGradient id="mgrSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1320" />
    </linearGradient>
    <filter id="mgrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring & Background -->
  <circle cx="60" cy="60" r="58" fill="url(#mgrBg)" stroke="#fbbf24" stroke-width="4" filter="url(#mgrShadow)" />
  <circle cx="60" cy="60" r="54" fill="#451a03" opacity="0.4" />

  <!-- Business Suit & Blouse -->
  <path d="M 24 112 C 26 84, 42 76, 60 76 C 78 76, 94 84, 96 112 Z" fill="url(#mgrSuit)" />
  <polygon points="60,98 50,76 70,76" fill="#f8fafc" />
  <polygon points="60,102 56,76 64,76" fill="#f59e0b" />

  <!-- Neck -->
  <rect x="52" y="64" width="16" height="18" rx="4" fill="url(#mgrSkin)" />

  <!-- Head -->
  <ellipse cx="60" cy="50" rx="19" ry="22" fill="url(#mgrSkin)" />

  <!-- Professional Hair Style -->
  <path d="M 38 46 C 36 26, 48 18, 60 18 C 74 18, 84 26, 82 46 C 85 58, 82 66, 78 70 C 76 62, 75 52, 74 46 C 68 34, 52 34, 46 46 C 44 52, 44 62, 42 70 C 38 66, 35 58, 38 46 Z" fill="url(#mgrHair)" />

  <!-- Eyes & Eyebrows -->
  <path d="M 48 44 Q 53 41 57 44" fill="none" stroke="#270e02" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 63 44 Q 67 41 72 44" fill="none" stroke="#270e02" stroke-width="1.8" stroke-linecap="round" />
  <ellipse cx="53" cy="48" rx="2" ry="2.5" fill="#1e293b" />
  <ellipse cx="67" cy="48" rx="2" ry="2.5" fill="#1e293b" />

  <!-- Smile -->
  <path d="M 54 60 Q 60 65 66 60" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

  <!-- Manager Briefcase Badge -->
  <circle cx="95" cy="95" r="15" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  <!-- Briefcase Icon -->
  <rect x="89" y="92" width="12" height="9" rx="1.5" fill="#ffffff" />
  <path d="M 92 92 L 92 89 C 92 88, 98 88, 98 89 L 98 92" fill="none" stroke="#ffffff" stroke-width="1.5" />
</svg>

